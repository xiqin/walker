<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walker · 飞书 Agent 桥接控制台</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/responsive.css">
</head>
<body>
  <section id="login" class="login-container" hidden aria-labelledby="login-title">
    <form id="login-form" class="login-box">
      <p class="eyebrow">LOCAL AGENT HUB</p>
      <h1 id="login-title">Walker 运维控制台</h1>
      <label for="login-token">管理 Token</label>
      <input id="login-token" name="token" type="password" autocomplete="current-password" required>
      <button type="submit">登录</button>
      <p id="login-error" role="alert" hidden></p>
    </form>
  </section>
  <div id="app"></div>
  <script type="module">
    import { startApp, createAuthRecovery } from './js/app.js';
    import { createApiClient } from './js/api.js';
    import * as dashboard from './js/pages/dashboard.js';
    import * as sessions from './js/pages/sessions.js';
    import * as logs from './js/pages/logs.js';
    import * as diagnostics from './js/pages/diagnostics.js';
    import * as connections from './js/pages/connections.js';
    import * as config from './js/pages/config.js';
    import * as process from './js/pages/process.js';
    import * as storage from './js/pages/storage.js';
    import * as debug from './js/pages/debug.js';

    const login = document.getElementById('login');
    const form = document.getElementById('login-form');
    const tokenInput = document.getElementById('login-token');
    const error = document.getElementById('login-error');
    const authRecovery = createAuthRecovery();
    let runtime = null;

    document.addEventListener('keydown', event => {
      if (event.key !== 'Escape') return;
      const focusMenu = () => {
        const shell = document.querySelector('.app');
        const menu = document.querySelector('.nav-toggle');
        if (shell?.dataset.navOpen === 'false' && menu && document.activeElement?.closest('.sidebar')) menu.focus();
      };
      queueMicrotask(focusMenu);
      requestAnimationFrame(focusMenu);
    });

    function showLogin(message = '') {
      runtime?.router?.stop();
      document.getElementById('app').hidden = true;
      login.hidden = false;
      error.textContent = message;
      error.hidden = !message;
      queueMicrotask(() => tokenInput.focus());
    }

    async function launch() {
      if (!runtime) {
        const api = createApiClient({ onUnauthorized: () => { authRecovery.remember(); showLogin('登录状态已失效，请重新登录'); } });
        runtime = await startApp({
          api,
          authRecovery,
          pages: { dashboard, sessions, logs, diagnostics, connections, config, process, storage, debug },
        });
      }
      else {
        await runtime.router.start();
      }
      document.getElementById('app').hidden = false;
      login.hidden = true;
      return runtime;
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      error.hidden = true;
      try {
        const response = await fetch('/api/admin/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify({ token: tokenInput.value }),
        });
        const payload = await response.json();
        if (!response.ok || !payload.ok) throw new Error(payload.error?.message || '登录失败');
        await launch();
        await authRecoveryResume();
        tokenInput.value = '';
      } catch (loginError) {
        showLogin(loginError.message || '登录失败');
      }
    });

    async function authRecoveryResume() {
      await authRecovery.resume(runtime.router);
    }

    try {
      const response = await fetch('/api/admin/auth/status', { headers: { Accept: 'application/json' } });
      const payload = await response.json();
      if (payload.data?.authenticated) await launch();
      else {
        authRecovery.remember();
        showLogin();
      }
    } catch (startupError) {
      showLogin(startupError.message || '无法连接 Walker Admin');
    }
  </script>
</body>
</html>
